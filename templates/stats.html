<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantu Health AI - Analytics Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f7f6; 
            margin: 0; 
            padding: 30px; 
            color: #333; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        h1 { 
            color: #1A5276; 
            margin-top: 0; 
            font-size: 24px; 
            text-align: center; 
        }
        .dashboard-header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        .export-btn {
            background: #1A5276; 
            color: white; 
            padding: 10px 16px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 600;
            transition: background 0.2s;
        }
        .export-btn:hover {
            background: #154360;
        }
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 16px; 
            margin-top: 24px; 
        }
        .card { 
            background: #eef2f3; 
            padding: 20px; 
            border-radius: 8px; 
            border-left: 5px solid #1A5276; 
        }
        .card h3 { 
            margin: 0 0 8px 0; 
            font-size: 14px; 
            color: #555; 
        }
        .card p { 
            margin: 0; 
            font-size: 22px; 
            font-weight: bold; 
            color: #1A5276; 
        }
        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 30px; 
            color: #1A5276; 
            text-decoration: none; 
            font-weight: 600; 
        }
        .back-link:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Bantu Health AI - Telemetry Dashboard</h1>
    <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 24px;">Real-time query analytics across Lusaka districts.</p>
    
    <!-- CSV Export Button Top-Right -->
    <div class="dashboard-header-actions">
        <a href="/export" class="export-btn">📥 Export Query CSV</a>
    </div>

    <div class="stats-grid">
        <div class="card">
            <h3>Total Triage Queries</h3>
            <p id="totalQueries">Loading...</p>
        </div>
        <div class="card" style="border-left-color: #1abc9c;">
            <h3>Busiest District</h3>
            <p id="busiestDistrict">Loading...</p>
        </div>
        <div class="card" style="border-left-color: #f39c12;">
            <h3>Top Searched Symptom</h3>
            <p id="topSymptom">Loading...</p>
        </div>
    </div>

    <a href="/" class="back-link">← Back to Triage Chat</a>
</div>

<script>
    async function fetchStats() {
        try {
            const response = await fetch('/stats');
            const data = await response.json();
            
            document.getElementById('totalQueries').innerText = data.total_queries;
            
            if (data.busiest_district) {
                document.getElementById('busiestDistrict').innerText = `${data.busiest_district.district} (${data.busiest_district.count} queries)`;
            } else {
                document.getElementById('busiestDistrict').innerText = 'No data yet';
            }

            if (data.top_symptoms && data.top_symptoms.length > 0) {
                document.getElementById('topSymptom').innerText = `${data.top_symptoms[0].symptom} (${data.top_symptoms[0].count})`;
            } else {
                document.getElementById('topSymptom').innerText = 'No data yet';
            }
        } catch (err) {
            console.error('Error fetching stats:', err);
        }
    }
    fetchStats();
</script>

</body>
</html>
