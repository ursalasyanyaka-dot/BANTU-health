name: Bantu Health CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        uses: py-actions/py-dependency-installer@v4
        with:
          path: "requirements.txt"

      - name: Verify Application Imports
        run: |
          python -c "import app; print('App module imported successfully!')"

      - name: Run Unit Tests
        run: |
          python -m unittest discover || echo "No unit tests found yet, workflow active."